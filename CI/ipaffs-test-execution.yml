trigger: none
pr: none

parameters:  
  - name: environment
    displayName: Environment
    type: string
    default: 'pre'
  - name: workers
    displayName: Number of Workers
    type: string
    default: '1'
  - name: seleniumGrid
    displayName: Selenium Grid URL
    type: string
    default: 'http://localhost:4444'
  - name: deviceName
    displayName: Device Name
    type: string
    default: 'Windows'
  - name: bsOSVersion
    displayName: BrowserStack OS Version
    type: string
    default: '11'
  - name: bsBrowserVersion
    displayName: BrowserStack Browser Version
    type: string
    default: 'latest'
  - name: target
    displayName: Target Browser
    type: string
    default: 'Chrome'
  - name: isEmulationEnabled
    displayName: Enable Emulation
    type: string
    default: 'false'
  - name: emulateDeviceInfo
    displayName: Emulated Device Info
    type: string
    default: 'iPhone 12 Pro'
  - name: isAccessibilityEnabled
    displayName: Is Accessibility Run Enabled
    type: boolean
    default: false
  - name: enableRetry
    displayName: Enable Failed Test Retry
    type: boolean
    default: false
  - name: featureFilter
    displayName: 'Run specific scenario(s) by tag (e.g. SPS-9104 or SPS-9104,SPS-7364). Leave as "all" to run all CHED stages.'
    type: string
    default: 'all'

stages:

  - ${{ if eq(parameters.featureFilter, 'all') }}:
    - stage: IPAFFS_OPS_CHEDA
      displayName: IPAFFS OPS - CHEDA
      variables:
        - template: 'variables/IPAFF/${{parameters.environment}}.yml'
      jobs:
        - template: run-test-template.yml
          parameters:
            jobName: IPAFFS_OPS_CHEDA
            environment: ${{ parameters.environment }}
            branchName: $(Build.SourceBranch)
            seleniumGrid: ${{ parameters.seleniumGrid }}
            deviceName: ${{ parameters.deviceName }}
            bsOSVersion: ${{ parameters.bsOSVersion }}
            workers: ${{ parameters.workers }}
            bsBrowserVersion: 'latest'
            target: ${{ parameters.target }}
            isEmulationEnabled: ${{ parameters.isEmulationEnabled }}
            emulateDeviceInfo: ${{ parameters.emulateDeviceInfo }}
            isAccessibilityEnabled: ${{ parameters.isAccessibilityEnabled }}
            enableRetry: ${{ parameters.enableRetry }}
            application: 'IPAFF'
            dependsOn: ''
            filterTestCases: 'TestCategory=CHEDA'
            featureFilter: ''

    - stage: IPAFFS_OPS_CHEDD
      displayName: IPAFFS OPS - CHEDD
      dependsOn: IPAFFS_OPS_CHEDA
      condition: always()
      variables:
        - template: 'variables/IPAFF/${{parameters.environment}}.yml'
      jobs:
        - template: run-test-template.yml
          parameters:
            jobName: IPAFFS_OPS_CHEDD
            environment: ${{ parameters.environment }}
            branchName: $(Build.SourceBranch)
            seleniumGrid: ${{ parameters.seleniumGrid }}
            deviceName: ${{ parameters.deviceName }}
            bsOSVersion: ${{ parameters.bsOSVersion }}
            workers: ${{ parameters.workers }}
            bsBrowserVersion: 'latest'
            target: ${{ parameters.target }}
            isEmulationEnabled: ${{ parameters.isEmulationEnabled }}
            emulateDeviceInfo: ${{ parameters.emulateDeviceInfo }}
            isAccessibilityEnabled: ${{ parameters.isAccessibilityEnabled }}
            enableRetry: ${{ parameters.enableRetry }}
            application: 'IPAFF'
            dependsOn: ''
            filterTestCases: 'TestCategory=CHEDD'
            featureFilter: ''

    - stage: IPAFFS_OPS_CHEDP
      displayName: IPAFFS OPS - CHEDP
      dependsOn: IPAFFS_OPS_CHEDD
      condition: always()
      variables:
        - template: 'variables/IPAFF/${{parameters.environment}}.yml'
      jobs:
        - template: run-test-template.yml
          parameters:
            jobName: IPAFFS_OPS_CHEDP
            environment: ${{ parameters.environment }}
            branchName: $(Build.SourceBranch)
            seleniumGrid: ${{ parameters.seleniumGrid }}
            deviceName: ${{ parameters.deviceName }}
            bsOSVersion: ${{ parameters.bsOSVersion }}
            workers: ${{ parameters.workers }}
            bsBrowserVersion: 'latest'
            target: ${{ parameters.target }}
            isEmulationEnabled: ${{ parameters.isEmulationEnabled }}
            emulateDeviceInfo: ${{ parameters.emulateDeviceInfo }}
            isAccessibilityEnabled: ${{ parameters.isAccessibilityEnabled }}
            enableRetry: ${{ parameters.enableRetry }}
            application: 'IPAFF'
            dependsOn: ''
            filterTestCases: 'TestCategory=CHEDP'
            featureFilter: ''

    - stage: IPAFFS_OPS_CHEDPP
      displayName: IPAFFS OPS - CHEDPP
      dependsOn: IPAFFS_OPS_CHEDP
      condition: always()
      variables:
        - template: 'variables/IPAFF/${{parameters.environment}}.yml'
      jobs:
        - template: run-test-template.yml
          parameters:
            jobName: IPAFFS_OPS_CHEDPP
            environment: ${{ parameters.environment }}
            branchName: $(Build.SourceBranch)
            seleniumGrid: ${{ parameters.seleniumGrid }}
            deviceName: ${{ parameters.deviceName }}
            bsOSVersion: ${{ parameters.bsOSVersion }}
            workers: ${{ parameters.workers }}
            bsBrowserVersion: 'latest'
            target: ${{ parameters.target }}
            isEmulationEnabled: ${{ parameters.isEmulationEnabled }}
            emulateDeviceInfo: ${{ parameters.emulateDeviceInfo }}
            isAccessibilityEnabled: ${{ parameters.isAccessibilityEnabled }}
            enableRetry: ${{ parameters.enableRetry }}
            application: 'IPAFF'
            dependsOn: ''
            filterTestCases: 'TestCategory=CHEDPP'
            featureFilter: ''

  - ${{ if ne(parameters.featureFilter, 'all') }}:
    - stage: IPAFFS_OPS_CUSTOM
      displayName: 'IPAFFS OPS - ${{ parameters.featureFilter }}'
      variables:
        - template: 'variables/IPAFF/${{parameters.environment}}.yml'
      jobs:
        - template: run-test-template.yml
          parameters:
            jobName: IPAFFS_OPS_CUSTOM
            environment: ${{ parameters.environment }}
            branchName: $(Build.SourceBranch)
            seleniumGrid: ${{ parameters.seleniumGrid }}
            deviceName: ${{ parameters.deviceName }}
            bsOSVersion: ${{ parameters.bsOSVersion }}
            workers: ${{ parameters.workers }}
            bsBrowserVersion: 'latest'
            target: ${{ parameters.target }}
            isEmulationEnabled: ${{ parameters.isEmulationEnabled }}
            emulateDeviceInfo: ${{ parameters.emulateDeviceInfo }}
            isAccessibilityEnabled: ${{ parameters.isAccessibilityEnabled }}
            enableRetry: ${{ parameters.enableRetry }}
            application: 'IPAFF'
            dependsOn: ''
            filterTestCases: ''
            featureFilter: ${{ parameters.featureFilter }}